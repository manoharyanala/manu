<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Image Finder</h1>
    </header>

    <main>
        <form id="search-form">
            <label for="search-input" class="sr-only">Search Images</label>
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search for images..." 
                required
            >
            <button type="submit" id="search-button">Search</button>
        </form>

        <div class="categories">
            <button type="button">Nature</button>
            <button type="button">Architecture</button>
            <button type="button">Animals</button>
            <button type="button">Space</button>
        </div>

        <div id="status" aria-live="polite"></div>

        <div id="results"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
